name: Uptime

# Checks that the site and the API answer. A failed run emails the repository
# owner, which is the alert. The API's host puts an idle instance to sleep, so
# the regular request also spares the next visitor a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API answers its health check
        run: |
          curl --fail --silent --show-error --max-time 100 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            https://conflict-analysis.onrender.com/api/healthz
      - name: API is ready to write briefs, and what it saves will last
        run: |
          code=$(curl --silent --show-error --max-time 30 --retry 2 --retry-all-errors \
            --output ready.json --write-out '%{http_code}' \
            https://conflict-analysis.onrender.com/api/readyz)
          cat ready.json; echo
          if grep -q '"durable":false' ready.json; then
            echo "::warning::The API has no database: saved briefs, rate limits and the cost ledger are lost on every restart. Set DATABASE_URL on the host."
          fi
          if [ "$code" != "200" ]; then
            echo "::error::The API is up but not ready (HTTP $code). The response above says which part is failing; if it is the model provider, check the key and the account's credit."
            exit 1
          fi
      - name: Site serves the app
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            https://conflict-analysis-vantage.vercel.app/ | grep -q '<div id="root">'
