openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: intelligence
    description: Vantage — conflict, in context.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /intelligence/analyze:
    post:
      operationId: analyzeArticle
      tags: [intelligence]
      summary: Analyze a conflict article (URL or text)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeArticleBody"
      responses:
        "200":
          description: Structured intelligence brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceBrief"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The article URL could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests from this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The model provider failed or returned an unusable brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Generation capacity or daily budget reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /intelligence/explore:
    post:
      operationId: exploreConflict
      tags: [intelligence]
      summary: Explore a conflict by topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExploreConflictBody"
      responses:
        "200":
          description: Conflict exploration brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceBrief"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The article URL could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests from this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The model provider failed or returned an unusable brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Generation capacity or daily budget reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    AnalyzeArticleBody:
      type: object
      properties:
        article:
          type: string
          description: Full text of the conflict news article
          minLength: 50
          maxLength: 20000
        url:
          type: string
          description: Public http(s) URL of a conflict news article to fetch
          maxLength: 2048
      description: Provide exactly one of article or url. The server rejects both and neither.
    ExploreConflictBody:
      type: object
      properties:
        topic:
          type: string
          description: Conflict topic to explore (e.g. "Gaza conflict", "Sudan civil war")
          minLength: 3
          maxLength: 240
      required: [topic]
    Location:
      type: object
      properties:
        city:
          type: string
        country:
          type: string
        region:
          type: string
          description: Broader geopolitical region (e.g. "Eastern Europe", "Middle East")
        lat:
          type: [number, "null"]
          description: Null when the location is unknown. Lat and lng are null together.
        lng:
          type: [number, "null"]
      required: [city, country, region, lat, lng]
    Perspective:
      type: object
      properties:
        actor:
          type: string
          description: Name of the actor or group holding this perspective
        alignment:
          type: string
          enum: [Western, Regional, State Media, Civil Society, Affected Population]
        framing:
          type: string
          description: How this actor frames the event (1-2 sentences)
        interests:
          type: string
          description: Underlying interest shaping this framing (1 sentence)
      required: [actor, alignment, framing, interests]
    RelatedEvent:
      type: object
      properties:
        date:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [strike, escalation, negotiation, humanitarian, political]
        lat:
          type: [number, "null"]
          description: Null when the event has no known location. Lat and lng are null together.
        lng:
          type: [number, "null"]
        searchQuery:
          type: string
          description: Google News search query to verify this event
      required: [date, title, description, type, lat, lng, searchQuery]
    CasualtyData:
      type: object
      properties:
        description:
          type: string
        civilianImpact:
          type: string
        allSides:
          type: string
      required: [description, civilianImpact, allSides]
    LiveEvent:
      type: object
      description: A news article returned by retrieval. Title, source, url and date come from the retrieval provider, never from the model.
      properties:
        title:
          type: string
        source:
          type: string
        url:
          type: string
        date:
          type: string
      required: [title, source, url, date]
    IntelligenceBrief:
      type: object
      properties:
        generatedAt:
          type: string
          description: ISO 8601 time the server generated this brief. Set once; unchanged when served from cache.
        inScope:
          type: boolean
          description: False when the input is not a conflict, crisis or geopolitical tension.
        headline:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        summary:
          type: string
        actors:
          type: array
          items:
            type: string
        perspectives:
          type: array
          items:
            $ref: "#/components/schemas/Perspective"
        relatedEvents:
          type: array
          items:
            $ref: "#/components/schemas/RelatedEvent"
        escalationRisk:
          type: string
          enum: [Low, Medium, High]
        escalationReason:
          type: string
        historicalContext:
          type: string
        affectedPopulation:
          type: string
        keyQuestion:
          type: string
        casualtyData:
          $ref: "#/components/schemas/CasualtyData"
        liveEvents:
          type: array
          items:
            $ref: "#/components/schemas/LiveEvent"
      required:
        - generatedAt
        - inScope
        - headline
        - location
        - summary
        - actors
        - perspectives
        - relatedEvents
        - escalationRisk
        - escalationReason
        - historicalContext
        - affectedPopulation
        - keyQuestion
        - casualtyData
        - liveEvents
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Stable machine-readable code, e.g. INVALID_INPUT, RATE_LIMITED, FETCH_BLOCKED, FETCH_FAILED, PROVIDER_UNAVAILABLE, MODEL_OUTPUT_INVALID, OVERLOADED, INTERNAL.
        message:
          type: string
          description: Safe to show to the person using the site.
        requestId:
          type: string
          description: Matches the X-Request-Id header and the server log line.
      required: [error]
